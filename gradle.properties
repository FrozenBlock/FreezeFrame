
# Increases the amount of memory Gradle can use and optimizes the GC
# -XX:+UseZGC
    org.gradle.jvmargs=-Xmx4G
# Helps with build times
    org.gradle.parallel=true
# Caches Dependencies for faster build times.
    org.gradle.caching=false

# Fabric Properties
    # Get new versions at https://fabricmc.net/develop and https://lambdaurora.dev/tools/import_quilt.html
    minecraft_version=26.3
    fabric_loader_version=0.19.5
    min_fabric_loader_version=0.19.0

# Mod Properties
    mod_id = freezeframe
    mod_name = Freeze Frame
    mod_author = FrozenBlock
    mod_version = 1.2
    # protocol version must be changed after each update with dual env changes
    protocol_version = 2
    maven_group = net.frozenblock
    archives_base_name = FreezeFrame
    subproject_prefix = ff
    java_version = 25
    mod_url = https://modrinth.com/mod/freeze-frame
    source_url = https://github.com/FrozenBlock/FreezeFrame
    issues_url = https://github.com/FrozenBlock/FreezeFrame/issues
    license = FrozenBlock Modding Oasis License v1.0
    repository = FrozenBlock/FreezeFrame

# Publishing
    modrinth_project_id = fmWrNxMj
    curseforge_project_id = 597465

# Dependencies
    fabric_api_version=0.161.0+26.3
    frozenlib_version=3.0-mc26.3
# External Mods
    modmenu_version=21.0.0-beta.1
    cloth_config_version=26.3.158

# NeoForge Properties (verify versions against the snapshot maven)
    neoforge_version=26.3.0.7-beta
    neoforge_loader_version_range=[4,)

# Optional: set to a PR/snapshot NeoForge maven URL, or leave blank to skip
    neoforge_snapshot_maven=
