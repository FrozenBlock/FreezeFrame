modLoader="javafml"
loaderVersion="[4,)"
license="FrozenBlock Modding Oasis License v1.0"
issueTrackerURL="https://github.com/FrozenBlock/FreezeFrame/issues"

[[mods]]
    modId="freezeframe"
    version="${mod_version}"
    displayName="Freeze Frame"
    displayURL="https://modrinth.com/mod/freeze-frame"
    logoFile="assets/freezeframe/icon.png"
    authors="Lunade/AViewFromTheTop, Lufurrius"
    description='''
Adds Cameras to Minecraft in an intuitive and vanilla way.
    '''

[[mixins]]
config="freezeframe.mixins.json"

[[mixins]]
config="freezeframe.neoforge.mixins.json"

[[ dependencies.freezeframe ]]
    modId="neoforge"
    type="required"
    versionRange="[~26.2-,)"
    ordering="NONE"
    side="BOTH"

[[ dependencies.freezeframe ]]
    modId="minecraft"
    type="required"
    versionRange="[~26.2-,)"
    ordering="NONE"
    side="BOTH"

[[ dependencies.freezeframe ]]
    modId="frozenlib"
    type="required"
    versionRange="[3.0,)"
    ordering="NONE"
    side="BOTH"

[[ dependencies.freezeframe ]]
    modId="cloth-config"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
